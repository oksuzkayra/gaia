[project]
name = "gaia"
version = "0.1.0"
description = "Gaia - CLI-first, AI-optional recon & attack surface analysis tool"
authors = [{ name = "Gaia Team" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.1",
    "uro>=0.4.0",
]

[project.scripts]
gaia = "gaia.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
